<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden}
.p{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:g .45s forwards}@keyframes g{to{opacity:1;transform:scale(1)}}
#tr{stroke-dasharray:1800;stroke-dashoffset:1800;animation:d 1.2s 3.6s forwards}@keyframes d{to{stroke-dashoffset:0}}
.f{opacity:0;animation:o .6s forwards}@keyframes o{to{opacity:1}}
</style></head><body><svg id="s" width="1664" height="630" viewBox="0 0 1664 630"></svg>
<script>
const S=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
const D=[['01',9,1],['02',8,1],['03',10,2],['04',14,4],['05',16,8],['06',13,4],['07',9,1],['08',10,1],['09',9,1],['10',11,3],['11',15,6],['12',17,15],['13',12,3],['14',8,1]];
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);S.appendChild(e);return e}
function tx(x,y,s,a){const e=el('text',Object.assign({x,y,'font-size':24,fill:'#1F2622','text-anchor':'middle'},a||{}));e.textContent=s;return e}
const x0=110,x1=1560,base=520,y0=30,X=v=>x0+(v-6)/12*(x1-x0),Y=v=>base-v/16*(base-y0);
[0,4,8,12,16].forEach(v=>{el('line',{x1:x0,x2:x1,y1:Y(v),y2:Y(v),stroke:'#DED3C1'});tx(x0-16,Y(v)+8,v,{'text-anchor':'end',fill:'#7A6F60'})});
[6,8,10,12,14,16,18].forEach(v=>tx(X(v),base+38,v,{fill:'#7A6F60'}));
el('line',{x1:x0,x2:x1,y1:base,y2:base,stroke:'#1F2622','stroke-width':2});
tx((x0+x1)/2,base+80,'Habitaciones preparadas en el día',{fill:'#5B5348'});
tx(x0,y0-4,'No conformidades por día',{'text-anchor':'start',fill:'#5B5348'});
el('rect',{x:X(14),y:y0,width:x1-X(14),height:base-y0,fill:'#B9482F',opacity:.07});
el('line',{x1:X(14),x2:X(14),y1:y0,y2:base,stroke:'#B9482F','stroke-dasharray':'8 6','stroke-width':2});
tx(X(14)+14,Y(13.5),'Zona de sobrecarga',{'text-anchor':'start',fill:'#B9482F','font-weight':700});
const n=D.length,mx=D.reduce((s,r)=>s+r[1],0)/n,my=D.reduce((s,r)=>s+r[2],0)/n;
let sxy=0,sxx=0,syy=0;D.forEach(r=>{sxy+=(r[1]-mx)*(r[2]-my);sxx+=(r[1]-mx)**2;syy+=(r[2]-my)**2});
const m=sxy/sxx,b=my-m*mx,rr=sxy/Math.sqrt(sxx*syy);
el('line',{id:'tr',x1:X(8.4),y1:Y(m*8.4+b),x2:X(17.6),y2:Y(m*17.6+b),stroke:'#1F2622','stroke-width':3,'stroke-dasharray':'1800'});
D.forEach((r,i)=>{const pk=r[0]=='12';el('circle',{cx:X(r[1]),cy:Y(r[2]),r:pk?16:12,fill:pk?'#B9482F':r[1]>=14?'#D98B6F':'#8A7F6E',class:'p',style:`animation-delay:${.3+i*.22}s`})});
tx(X(17)-26,Y(15)+9,'Sábado 12: 15 errores',{'text-anchor':'end','font-weight':700,class:'f',style:'animation-delay:3.2s'});
tx(x0+20,Y(14.5),`r =${rr.toFixed(3).replace('.',',')}`,{'text-anchor':'start','font-size':36,'font-weight':700,class:'f',style:'animation-delay:4.6s'});
tx(x0+20,Y(14.5)+40,`y = ${m.toFixed(2).replace('.',',')}x − ${(-b).toFixed(2).replace('.',',')}`,{'text-anchor':'start',fill:'#5B5348',class:'f',style:'animation-delay:4.6s'});
</script></body></html>
