<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#1F2622;overflow:hidden}
#v{font-size:30px;font-weight:700;height:44px}#v span{color:#B9482F}
.k{display:flex;gap:20px;margin:8px 0 20px}.t{flex:1;background:#FBF7F0;border-radius:16px;padding:18px 24px}
.l{font-size:24px;color:#5B5348}.n{font-size:56px;font-weight:700;margin-top:4px;transition:color .4s}
.bad{color:#B9482F}
</style></head><body>
<div id="v"></div>
<div class="k"><div class="t"><div class="l">No conformes</div><div class="n" id="k1"></div></div><div class="t"><div class="l">Preparadas</div><div class="n" id="k2"></div></div><div class="t"><div class="l">No conformidades</div><div class="n" id="k3"></div></div><div class="t"><div class="l">Tiempo medio</div><div class="n" id="k4"></div></div><div class="t"><div class="l">Cpk</div><div class="n" id="k5"></div></div></div>
<svg id="s" width="1664" height="290" viewBox="0 0 1664 290"></svg>
<script>
const G=[['Todos los días',['22,4%','161','51','36,2 min','0,54'],()=>true],['Entre semana',['12,2%','74','11','34,2 min','0,70'],d=>!d[2]],['Fin de semana',['31,0%','87','40','37,8 min','0,42'],d=>d[2]],['Sábado 12',['58,8%','17','15','39,1 min','0,31'],d=>d[0]=='12']];
const D=[['01','Mar',0,1/9],['02','Mié',0,1/8],['03','Jue',0,.1],['04','Vie',1,3/14],['05','Sáb',1,5/16],['06','Dom',1,3/13],['07','Lun',0,1/9],['08','Mar',0,.1],['09','Mié',0,1/9],['10','Jue',0,2/11],['11','Vie',1,4/15],['12','Sáb',1,10/17],['13','Dom',1,2/12],['14','Lun',0,1/8]];
const S=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);S.appendChild(e);return e}
const bw=1500/14,base=230,Y=v=>base-v/.65*200,bars=[];
el('line',{x1:0,x2:1500,y1:Y(.08),y2:Y(.08),stroke:'#3D6B4F','stroke-width':3,'stroke-dasharray':'10 6'});
const mt=el('text',{x:1516,y:Y(.08)+8,'text-anchor':'start','font-size':24,fill:'#3D6B4F','font-weight':700});mt.textContent='Meta 8%';
D.forEach((d,i)=>{const r=el('rect',{x:i*bw+14,width:bw-28,y:Y(d[3]),height:base-Y(d[3]),rx:8,fill:'#BFB29E'});r.style.transition='fill .4s';bars.push(r);
const t=el('text',{x:i*bw+bw/2,y:base+34,'text-anchor':'middle','font-size':24,fill:'#5B5348'});t.textContent=d[1]+' '+d[0]});
let i=0;function show(){const g=G[i%G.length];document.getElementById('v').innerHTML='Vista: <span>'+g[0]+'</span>';
g[1].forEach((v,j)=>{const e=document.getElementById('k'+(j+1));e.textContent=v;e.className='n'+((j==0||j==4)?' bad':'')});
D.forEach((d,j)=>bars[j].setAttribute('fill',g[2](d)?'#B9482F':'#D8CDBB'));i++}
show();setInterval(show,3500);
</script></body></html>
