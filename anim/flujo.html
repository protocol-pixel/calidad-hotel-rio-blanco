<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#1F2622;background:transparent;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:baseline;gap:32px;height:52px}
#mode{font-size:32px;font-weight:700;white-space:nowrap}#cnt{font-size:26px;color:#3A332B;white-space:nowrap}
svg{display:block}#msg{font-size:28px;color:#3A332B;margin-top:4px}
</style></head><body>
<div id="top"><div id="mode"></div><div id="cnt"></div></div>
<svg id="s" width="1664" height="480" viewBox="0 0 1664 480"></svg>
<div id="msg"></div>
<script>
const S=document.getElementById('s'),NS='http://www.w3.org/2000/svg',M=document.getElementById('mode'),C=document.getElementById('cnt'),G=document.getElementById('msg');
const X=i=>104+i*208,TY=260,TERRA='#B9482F',OK='#3D6B4F',NEU='#8A7F6E';
const st=[['Check-out','',0],['Aviso a','limpieza',0],['Ropa blanca','PCC-1',1],['Limpiar baño','y habitación',1],['Cama y','art. de aseo',1],['Inspección','PCC-2',2],['Liberar','habitación',2],['Check-in','del huésped',0]];
const roles=['Recepción','Limpieza','Supervisora'],rc=['#5B6B63','#9A6E14','#3D6B4F'];
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
function tx(x,y,s,a,p){const e=el('text',Object.assign({x,y,'text-anchor':'middle','font-size':24,fill:'#1F2622'},a||{}),p);e.textContent=s;return e}
el('line',{x1:X(0),x2:X(7),y1:TY,y2:TY,stroke:'#CBBFAB','stroke-width':5,'stroke-linecap':'round'});
const loop=el('path',{d:`M${X(5)} ${TY}V370H${X(3)}V${TY}`,fill:'none',stroke:TERRA,'stroke-width':3,'stroke-dasharray':'10 8'});
const loopT=tx((X(3)+X(5))/2,408,'Corregir y volver a inspeccionar',{fill:TERRA,'font-weight':600});
let g5,r5;
st.forEach((s,i)=>{const g=el('g',{});const r=el('rect',{x:X(i)-96,y:30,width:192,height:100,rx:14,fill:(i==2||i==5)?'#F3DFB4':'#FBF7F0',stroke:'#1F2622','stroke-width':2},g);
tx(X(i),s[1]?72:88,s[0],{'font-weight':700},g);if(s[1])tx(X(i),104,s[1],{},g);tx(X(i),172,roles[s[2]],{fill:rc[s[2]],'font-weight':600},g);
el('line',{x1:X(i),x2:X(i),y1:186,y2:TY-10,stroke:'#CBBFAB','stroke-width':2},g);if(i==5){g5=g;r5=r}});
const no=tx(X(5),222,'No existe hoy',{fill:TERRA,'font-weight':700});
const pop=tx(X(7),330,'¡Reclamo!',{fill:TERRA,'font-weight':700,'font-size':32,opacity:0});
[[NEU,'Habitación en preparación'],[TERRA,'Con defecto'],[OK,'Verificada y lista']].forEach((l,i)=>{el('circle',{cx:40+i*420,cy:458,r:14,fill:l[0]});tx(64+i*420,466,l[1],{'text-anchor':'start'})});
let mode=0,t0=performance.now(),last=t0,acc=0,k=0,toks=[],n=0,d=0,c=0,popT=-9;
function setMode(m){mode=m;toks.forEach(o=>o.e.remove());toks=[];n=d=c=0;acc=0;
g5.setAttribute('opacity',m?1:.35);r5.setAttribute('stroke-dasharray',m?'':'8 6');no.setAttribute('opacity',m?0:1);loop.setAttribute('opacity',m?1:0);loopT.setAttribute('opacity',m?1:0);
M.textContent=m?'Proceso propuesto: con inspección final':'Proceso actual: sin inspección final';M.style.color=m?OK:TERRA;
G.textContent=m?'Los defectos se detectan en la inspección (PCC-2) y vuelven a limpieza antes del check-in.':'Sin revisión final, 22 de cada 100 habitaciones llegan al huésped con defectos.'}
setMode(0);
const v=200,L=110+416+110;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
if(now-t0>17000){setMode(1-mode);t0=now}
acc+=dt;if(acc>.9){acc=0;k++;const def=Math.floor(k*.224)>Math.floor((k-1)*.224);toks.push({x:X(0),y:TY,seg:-1,def,fix:0,ok:0,sh:0,e:el('circle',{cx:X(0),cy:TY,r:16,fill:NEU})})}
for(let i=toks.length-1;i>=0;i--){const o=toks[i];
if(o.seg<0){o.x+=v*dt;o.y=TY;
if(o.def&&!o.sh&&o.x>=X(3)){o.sh=1;o.e.setAttribute('fill',TERRA)}
if(mode==1&&o.def&&o.x>=X(5)){o.x=X(5);o.seg=0;o.p=0}
else if(mode==1&&!o.ok&&o.x>=X(5)){o.ok=1;o.e.setAttribute('fill',OK)}
if(o.x>=X(7)){n++;if(o.def){d++;popT=now}o.e.remove();toks.splice(i,1);continue}}
else{o.p+=v*dt;const p=o.p;
if(p<110){o.x=X(5);o.y=TY+p}else if(p<526){o.x=X(5)-(p-110);o.y=370}else if(p<L){o.x=X(3);o.y=370-(p-526)}
else{o.seg=-1;o.x=X(3);o.y=TY;o.def=false;c++;o.e.setAttribute('fill',NEU)}}
o.e.setAttribute('cx',o.x);o.e.setAttribute('cy',o.y)}
const a=Math.max(0,1-(now-popT)/1200);pop.setAttribute('opacity',mode?0:a);
C.textContent=mode?`Entregadas ${n} · corregidas ${c} · con defecto 0`:`Entregadas ${n} · con defecto ${d}`+(n?` (${Math.round(d/n*100)}%)`:'');
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
